syntax = "proto3";
package game;

enum GameError {
  GAME_ERROR_UNSPECIFIED = 0;
  // `StartPlaySession`: the `level_id` is not 0. A run has no level target.
  GAME_ERROR_LEVEL_NOT_FOUND = 1001;
  // `BuyShopProduct`: the product is a step of a permanent upgrade whose earlier step is not bought yet, or whose
  // step is already bought.
  GAME_ERROR_UPGRADE_ORDER = 1002;
}
